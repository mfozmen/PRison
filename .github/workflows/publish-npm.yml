name: Publish npm package

# The same trigger as the image: a published release, whose tag is the version.
# workflow_dispatch republishes an existing tag when this run failed but the
# release landed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.34.0"
        required: true

permissions:
  contents: read
  # Provenance, and trusted publishing once it is set up on npmjs.com: npm
  # proves the package was built here, from this tag.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older one.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - run: node scripts/pack-npm.mjs

      # The package is only published if it actually starts and serves a page.
      - name: Smoke test
        run: |
          node npm-package/bin/prison.mjs --no-open --port 7790 &
          pid=$!
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7790/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          kill "$pid"
          [ "$code" = "200" ] || { echo "PRison did not answer: $code"; exit 1; }

      - run: npm publish ./npm-package --provenance --access public
        env:
          # Used until trusted publishing is configured for the package on
          # npmjs.com; after that npm authenticates through id-token instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
